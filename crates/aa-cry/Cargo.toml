[package]
name = "aa-cry"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CryEngine asset formats (DDS, MTL, CGF/CHR/SKIN) to Bevy"

[dependencies]
aa-pak.workspace = true
bevy.workspace = true
# Same glam as bevy_math: the plain-data layer (chunk, skeleton, mesh) uses glam types only, which
# are bevy::math types.
glam = "0.33"
thiserror.workspace = true
roxmltree.workspace = true
web-time = "1"

[dev-dependencies]
aa-dev.workspace = true

# The PBR specular / anisotropy maps natively; the browser build leaves them out (WebGPU allows 16
# samplers per shader stage and they take the standard material past it).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { workspace = true, features = ["pbr_specular_textures", "pbr_anisotropy_texture"] }

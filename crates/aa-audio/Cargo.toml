[package]
name = "aa-audio"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ArcheAge 1.2 sound: FSB5 banks (FMOD Vorbis), FEV events and playback in Bevy"

[dependencies]
aa-pak.workspace = true
thiserror.workspace = true
# Pure Rust Vorbis decoder, packet API only (the Ogg container reader is not needed: FSB5 stores bare packets).
lewton = { version = "0.10", default-features = false }
# MPEG audio decoder (the voice banks are MPEG layer II, some maybe layer III), pure Rust.
symphonia-bundle-mp3 = { version = "0.6", default-features = false, features = ["mp1", "mp2", "mp3"] }
symphonia-core = "0.6"
# The mixer: pure Rust, cpal output, spatial tracks (panning) and streaming sounds. bevy_audio (rodio)
# has no distance model beyond a linear fall off and cannot stream a custom decoder; see docs/aa-audio.md.
kira = { version = "0.12", default-features = false, features = ["cpal"] }
aa-cry.workspace = true
bevy.workspace = true
tracing.workspace = true
rusqlite.workspace = true
roxmltree.workspace = true

[dev-dependencies]
aa-dev.workspace = true

[build-dependencies]
# The one original CELT bank uses the incompatible pre-Opus 0.11 bitstream.
# Build the pinned, private legacy decoder statically; cc is already locked.
cc = "=1.8.0"

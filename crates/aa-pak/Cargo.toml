[package]
name = "aa-pak"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Read-only access to the ArcheAge 1.2 game_pak archive"

[dependencies]
aes.workspace = true
basisu = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
zstd = "0.13"

# Browser: blocks over HTTP (see src/web.rs), pure-Rust zstd.
[target.'cfg(target_arch = "wasm32")'.dependencies]
ruzstd = "0.8"
serde_json = "1"
futures-util = "0.3"
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Response", "console"] }

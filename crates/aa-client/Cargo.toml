[package]
name = "aa-client"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The ArcheAge 1.2 client remake: screen flow from world select to in-game"

[dependencies]
bevy.workspace = true
aa-dev.workspace = true
aa-pak.workspace = true
aa-cry.workspace = true
aa-anim.workspace = true
aa-world.workspace = true
aa-fx.workspace = true
aa-ui.workspace = true
aa-net = { workspace = true, features = ["bevy"] }
mlua.workspace = true
rusqlite.workspace = true
roxmltree.workspace = true
anyhow.workspace = true

[features]
# Build without the character create screen (`login/create`), e.g. while it is being rewritten:
# `cargo build -p aa-client --features no-create`.
no-create = []

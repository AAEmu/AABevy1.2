[package]
name = "aa-client"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The ArcheAge 1.2 client remake: screen flow from world select to in-game"

[dependencies]
bevy = { workspace = true, features = ["png"] }
aa-dev.workspace = true
aa-pak.workspace = true
aa-cry.workspace = true
aa-anim.workspace = true
aa-world.workspace = true
aa-fx.workspace = true
aa-audio.workspace = true
aa-midi = { path = "../aa-midi" }
aa-ui.workspace = true
aa-lua.workspace = true
aa-net = { workspace = true, features = ["bevy"] }
mlua.workspace = true
rusqlite.workspace = true
roxmltree.workspace = true
anyhow.workspace = true
serde_json = "1"

[features]
# Build without the character create screen (`login/create`), e.g. while it is being rewritten:
# `cargo build -p aa-client --features no-create`.
no-create = []
# Bevy's per-system spans written as a Chrome trace (`TRACE_CHROME=<file.json>`; open it in https://ui.perfetto.dev):
# `cargo build --release -p aa-client --features trace`. Rebuilds Bevy once (its artifacts are kept next to the
# normal ones); copy the exe aside, it replaces target/release/aa-client.exe.
trace = ["bevy/trace_chrome"]

[[example]]
name = "client"
path = "src/main.rs"

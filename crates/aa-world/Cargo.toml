[package]
name = "aa-world"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "World rendering: terrain, cell objects, vegetation, water, sky"

[dependencies]
aa-pak.workspace = true
aa-cry.workspace = true
aa-fx.workspace = true
aa-audio.workspace = true
bevy = { workspace = true, features = ["pbr_light_textures", "pbr_clustered_decals"] }
half = "2"
flate2 = "1"
roxmltree.workspace = true
web-time = "1"
thiserror.workspace = true

# the browser: long builds hand the page a frame now and then (see `terrain_layers::Slicer`)
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window"] }

[dev-dependencies]
aa-dev.workspace = true

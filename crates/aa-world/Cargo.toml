[package]
name = "aa-world"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "World rendering: terrain, cell objects, vegetation, water, sky"

[dependencies]
aa-pak.workspace = true
aa-cry.workspace = true
aa-fx.workspace = true
aa-audio.workspace = true
bevy = { workspace = true, features = ["pbr_light_textures", "pbr_clustered_decals"] }
half = "2"
flate2 = "1"
roxmltree.workspace = true
thiserror.workspace = true

[dev-dependencies]
aa-dev.workspace = true

# tests/post_shader.rs: the post pass shaders compiled as Bevy does (wesl, then naga's validator), with no window.
# Both are in Cargo.lock already (Bevy's shader loader and wgpu use them).
wesl = { version = "0.6", features = ["naga-ext"] }
naga = { version = "30", features = ["wgsl-in"] }

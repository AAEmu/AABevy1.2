[package]
name = "aa-net"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Login, game and stream protocol client for the AAEmu server (ArcheAge 1.2), with an optional Bevy plugin"

[features]
default = []
# `NetPlugin`: runs the session on a background thread and exposes resources + messages.
bevy = ["dep:bevy"]

[dependencies]
tokio.workspace = true
thiserror.workspace = true
tracing.workspace = true
bevy = { workspace = true, optional = true }
sha2 = "0.10"

[dev-dependencies]
anyhow.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[example]]
name = "bevy_walkthrough"
required-features = ["bevy"]

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>AAEMU 1.2</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<script type="importmap">{ "imports": { "wasi_snapshot_preview1": "./wasi_shim.js" } }</script>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;color:#cdb98a;font:14px/1.4 system-ui,sans-serif}
#game{display:block;width:100vw;height:100vh;outline:none}
#status{position:fixed;left:0;right:0;bottom:12%;text-align:center;text-shadow:0 1px 2px #000;pointer-events:none}
#status.err{color:#f77}
</style></head><body>
<canvas id="game" tabindex="0"></canvas>
<div id="status">Loading…</div>
<script type="module">
const status = document.getElementById('status');
const say = (t, err) => { status.textContent = t; status.className = err ? 'err' : ''; };
// the service worker keeps pak blocks across visits (and claims this page once it is active), also when the game
// page is opened directly rather than from the launcher
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
// Render pipelines compile on the GPU process's worker threads (createRenderPipelineAsync) instead of one after the
// other on its main thread, which stalls the page: Bevy's pipeline cache (vendor/bevy_render, `web_precompile`)
// sets window.aaPrecompile to a slot around a first creation, gets a placeholder, and creates the pipeline for real
// (a cache hit) once the slot is done.
if (navigator.gpu) {
  const create = GPUDevice.prototype.createRenderPipeline;
  GPUDevice.prototype.createRenderPipeline = function (d) {
    const slot = window.aaPrecompile;
    if (!slot) return create.call(this, d);
    slot.started = true;
    this.createRenderPipelineAsync(d).then(() => { slot.done = true; }, () => { slot.done = true; });
    return {};
  };
  window.aaPrecompileHook = true;
}
if (!navigator.gpu) say('This browser has no WebGPU (use a current Chrome, Edge or Firefox).', true);
else try {
  const client = await import('./pkg/aa-client.js');
  const { default: init, start } = client;
  window.aaSyncLog = client.aa_pak_sync_log; // dev: which files stalled the page (see aa_pak::web)
  window.aaTouchLog = client.aa_pak_touch_log; // dev: every block read, in order (web/client/warm.txt)
  const { setMemory } = await import('./wasi_shim.js');
  const w = await init();
  setMemory(w.memory);
  window.aaMemory = w.memory; // dev: the heap size (aaMemory.buffer.byteLength)
  // start() loads the pak index, the game database and the login stage, then runs the app; it
  // reports progress through window.aaStatus and returns once the app owns the event loop.
  window.aaStatus = say;
  await start();
  status.remove();
} catch (e) {
  // winit leaves the event loop by throwing; anything else is a real failure
  if (!String(e).includes('Using exceptions for control flow')) { console.error(e); say(`Failed: ${e}`, true); }
  else status.remove();
}
</script>
</body></html>
